name = "btc-alt-scalper-v7"
main = "worker.js"
compatibility_date = "2026-09-10"

[vars]
# 실시간 기술 신호 기본값
MIN_SCORE = "75"
TP1_PERCENT = "1.2"
TP2_PERCENT = "2.2"
STOP_LOSS_PERCENT = "0.8"
BUY_COOLDOWN_MINUTES = "20"
SELL_COOLDOWN_MINUTES = "60"
MAX_BUY_ALERTS = "2"
CRON_DELAY_SECONDS = "12"

# v8.3.1 외부 컨텍스트 + 패턴 + 대세 Regime Quality 보호장치
# 외부 호재만으로 BUY를 만들지 않습니다. 기술적 hard gate는 항상 필수입니다.
CONTEXT_BLOCK_THRESHOLD = "-8"
CONTEXT_SELL_THRESHOLD = "-12"

# Pattern Confirmation: 패턴은 단독 매수 신호가 아니라 기존 기술조건의 확인 필터입니다.
PATTERN_CONFIRMATION = "true"
PATTERN_BUY_MIN_SCORE = "2"
PATTERN_SELL_SCORE = "-4"

# v8.3.1 Market Regime Engine: BTC 완료 일봉으로 STRONG_BULL/BULL/RANGE/BEAR/CRASH를 판정합니다.
REGIME_ENGINE = "true"

# 수동 장부와 백테스트에 반영할 편도 거래 수수료 기본값(%)
TRADING_FEE_PERCENT = "0.05"

[triggers]
crons = ["*/5 * * * *"]

# 기존 SCALPER_KV를 배포 설정에 고정하여 GitHub 자동배포 때 binding이 사라지지 않게 합니다.
[[kv_namespaces]]
binding = "SCALPER_KV"
id = "b1d33dfeca5440dbba9b76b769c6bf95"

# 거시경제 데이터는 별도 API 키 없이 공식 공개 원천(Treasury/Fed/Cboe/BLS/EIA)을 사용합니다.
# 토큰/키가 필요한 선택 기능(CryptoPanic 등)은 GitHub에 적지 말고 Cloudflare Secret으로만 등록하세요.
